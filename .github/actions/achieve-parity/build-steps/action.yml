name: 'Achieve Parity Build Steps'
description: 'Sets up the TUF .NET development environment for achieve-parity workflow'
runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Install .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    
    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
        restore-keys: |
          nuget-${{ runner.os }}-
    
    - name: Restore dependencies
      shell: bash
      run: dotnet restore ./TUF.slnx
    
    - name: Build solution
      shell: bash
      run: dotnet build ./TUF.slnx --configuration Release --no-restore
    
    - name: Run all tests
      shell: bash
      run: dotnet test --configuration Release --no-build --verbosity normal
    
    - name: Verify conformance CLI builds
      shell: bash
      run: dotnet publish examples/TufConformanceCli/TufConformanceCli.csproj --configuration Release --no-restore
