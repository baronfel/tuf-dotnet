# TUF .NET Container Deployment - Docker Compose
# This configuration allows for local development and testing of the containerized TUF application

version: '3.8'

services:
  # TUF application container
  tuf-app:
    build:
      context: ../..
      dockerfile: examples/ContainerDeployment/Dockerfile
    container_name: tuf-container-example
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TUF_METADATA_URL=https://example.com/metadata
      - TUF_TARGETS_URL=https://example.com/targets
      - TUF_TRUSTED_ROOT_PATH=/app/trusted-root.json
    volumes:
      # Mount a local trusted root file if available
      - ./trusted-root.json:/app/trusted-root.json:ro
      # Persistent storage for metadata and targets (optional)
      - tuf-metadata:/tmp/tuf-metadata
      - tuf-targets:/tmp/tuf-targets
    networks:
      - tuf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Security settings
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional: Simple file server for local TUF repository testing
  tuf-repository:
    image: nginx:alpine
    container_name: tuf-repository-server
    ports:
      - "8081:80"
    volumes:
      - ./test-repository:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - tuf-network
    restart: unless-stopped

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: tuf-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - tuf-network
    restart: unless-stopped

networks:
  tuf-network:
    driver: bridge
    name: tuf-network

volumes:
  tuf-metadata:
    name: tuf-metadata
  tuf-targets:
    name: tuf-targets