# Production NGINX configuration for TUF Repository Server
# Provides HTTPS termination, caching, and security headers

upstream tuf-backend {
    server tuf-server:8080;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/javascript text/css application/xml;

    # Rate limiting for metadata endpoints
    limit_req_zone $binary_remote_addr zone=metadata:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=targets:10m rate=50r/s;

    # TUF metadata endpoints with caching
    location ~ ^/metadata/(root|timestamp|snapshot|targets)\.json$ {
        limit_req zone=metadata burst=20 nodelay;
        
        proxy_pass http://tuf-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Caching strategy based on metadata type
        location ~ ^/metadata/timestamp\.json$ {
            # Timestamp should not be cached (freshness critical)
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            proxy_pass http://tuf-backend;
        }
        
        location ~ ^/metadata/(root|snapshot|targets)\.json$ {
            # Other metadata can be cached briefly
            add_header Cache-Control "public, max-age=300" always;  # 5 minutes
            proxy_pass http://tuf-backend;
        }
    }

    # Target files with longer caching
    location /targets/ {
        limit_req zone=targets burst=100 nodelay;
        
        proxy_pass http://tuf-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Target files are immutable and can be cached aggressively
        add_header Cache-Control "public, max-age=31536000, immutable" always;  # 1 year
    }

    # Health checks
    location /health {
        proxy_pass http://tuf-backend;
        access_log off;
    }

    location /ready {
        proxy_pass http://tuf-backend;
        access_log off;
    }

    # Root endpoint
    location = / {
        proxy_pass http://tuf-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metrics endpoint (optional, consider restricting access)
    location /metrics {
        # Uncomment to restrict access to internal networks only
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;
        
        proxy_pass http://tuf-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block access to everything else
    location / {
        return 404;
    }
}