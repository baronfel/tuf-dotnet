version: '3.8'

services:
  tuf-server:
    build:
      context: ../../
      dockerfile: examples/ProductionTufServer/Dockerfile
    container_name: production-tuf-server
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TUF_METADATA_PATH=/app/metadata
      - TUF_TARGETS_PATH=/app/targets
      # CORS configuration - adjust for your needs
      - CORS__AllowedOrigins__0=http://localhost:3000
      - CORS__AllowedOrigins__1=https://yourdomain.com
    volumes:
      # Mount your TUF repository data
      - ./sample-repository/metadata:/app/metadata:ro
      - ./sample-repository/targets:/app/targets:ro
      # Optional: Mount logs directory
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Security settings
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
  # Optional: Add reverse proxy for HTTPS termination
  nginx:
    image: nginx:alpine
    container_name: tuf-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Your SSL certificates
    depends_on:
      - tuf-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  metadata:
    driver: local
  targets:
    driver: local